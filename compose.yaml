name: homelab-${ENV_NAME}
services:
  homepage:
    image: ghcr.io/gethomepage/homepage:${HOMEPAGE_VERSION}
    environment:
      TZ: Europe/London
      HOMEPAGE_ALLOWED_HOSTS: homepage.${DOMAIN_SUFFIX}
      HOMEPAGE_VAR_DOMAIN_SUFFIX: ${DOMAIN_SUFFIX}
      HOMEPAGE_VAR_ENV_NAME: ${ENV_NAME}
    volumes:
      - type: bind
        source: /srv/data/${ENV_NAME}/homepage/config
        target: /app/config
        bind:
          create_host_path: false
    configs:
      - source: homepage_docker
        target: /app/config/docker.yaml
        mode: 0444
      - source: homepage_settings
        target: /app/config/settings.yaml
        mode: 0444
      - source: homepage_services
        target: /app/config/services.yaml
        mode: 0444
    networks:
      backend:
        aliases:
          - homelab-${ENV_NAME}_homepage
      ingress: {}
      homepage-discovery: {}
    scale: ${HOMEPAGE_REPLICAS}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    mem_limit: 256M
    mem_reservation: 128M
    labels:
      - traefik.enable=true
      - traefik.http.routers.homepage-${ENV_NAME}.rule=Host(`homepage.${DOMAIN_SUFFIX}`)
      - traefik.http.routers.homepage-${ENV_NAME}.tls=true
      - traefik.http.routers.homepage-${ENV_NAME}.tls.certresolver=desec
      - traefik.http.routers.homepage-${ENV_NAME}.tls.domains[0].main=${DOMAIN_SUFFIX}
      - traefik.http.routers.homepage-${ENV_NAME}.tls.domains[0].sans=*.${DOMAIN_SUFFIX}
      - traefik.http.services.homepage-${ENV_NAME}.loadbalancer.server.port=3000
      - traefik.docker.network=homelab-ingress
      - home-services.managed=true
  pihole:
    image: pihole/pihole:${PIHOLE_VERSION}
    environment:
      TZ: Europe/London
      WEBPASSWORD_FILE: pihole_web_password
      FTLCONF_dns_listeningMode: all
      FTLCONF_misc_etc_dnsmasq_d: 'true'
      FTLCONF_dns_upstreams: 1.1.1.1;8.8.8.8
      FTLCONF_files_macvendor: /macvendor.db
    dns:
      - 1.1.1.1
      - 8.8.8.8
    tmpfs:
      - /etc/pihole
    configs:
      - source: pihole_custom_dns
        target: /etc/dnsmasq.d/02-custom-dns.conf
        mode: 0644
    secrets:
      - pihole_web_password
    ports:
      - ${N100_LAN_IP:?Set N100_LAN_IP in the tracked environment file}:${PIHOLE_DNS_PORT}:53/tcp
      - ${N100_LAN_IP:?Set N100_LAN_IP in the tracked environment file}:${PIHOLE_DNS_PORT}:53/udp
      - ${DNS_SECONDARY_IP:?Set DNS_SECONDARY_IP in the tracked environment file}:${PIHOLE_DNS_PORT}:53/tcp
      - ${DNS_SECONDARY_IP:?Set DNS_SECONDARY_IP in the tracked environment file}:${PIHOLE_DNS_PORT}:53/udp
    cap_add:
      - NET_ADMIN
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
      backend:
        aliases:
          - homelab-${ENV_NAME}_pihole
      ingress: {}
    scale: ${PIHOLE_REPLICAS}
    restart: unless-stopped
    mem_limit: 256M
    mem_reservation: 128M
    labels:
      - homepage.instance.${ENV_NAME}.group=Infrastructure
      - homepage.instance.${ENV_NAME}.name=Pi-hole
      - homepage.instance.${ENV_NAME}.icon=pi-hole.png
      - homepage.instance.${ENV_NAME}.href=https://pihole.${DOMAIN_SUFFIX}
      - homepage.instance.${ENV_NAME}.description=DNS filtering and ad blocking
      - traefik.enable=true
      - traefik.http.routers.pihole-${ENV_NAME}.rule=Host(`pihole.${DOMAIN_SUFFIX}`)
      - traefik.http.routers.pihole-${ENV_NAME}.tls=true
      - traefik.http.routers.pihole-${ENV_NAME}.tls.certresolver=desec
      - traefik.http.routers.pihole-${ENV_NAME}.tls.domains[0].main=${DOMAIN_SUFFIX}
      - traefik.http.routers.pihole-${ENV_NAME}.tls.domains[0].sans=*.${DOMAIN_SUFFIX}
      - traefik.http.services.pihole-${ENV_NAME}.loadbalancer.server.port=80
      - traefik.docker.network=homelab-ingress
      - home-services.managed=true
  home-assistant:
    image: ghcr.io/home-assistant/home-assistant:${HOME_ASSISTANT_VERSION}
    environment:
      TZ: Europe/London
    volumes:
      - type: bind
        source: /srv/data/${ENV_NAME}/home-assistant/config
        target: /config
        bind:
          create_host_path: false
    networks:
      backend:
        aliases:
          - homelab-${ENV_NAME}_home-assistant
      ingress: {}
    scale: ${HOME_ASSISTANT_REPLICAS}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    mem_limit: 1G
    mem_reservation: 512M
    labels:
      - homepage.instance.${ENV_NAME}.group=Home
      - homepage.instance.${ENV_NAME}.name=Home Assistant
      - homepage.instance.${ENV_NAME}.icon=home-assistant.png
      - homepage.instance.${ENV_NAME}.href=https://home-assistant.${DOMAIN_SUFFIX}
      - homepage.instance.${ENV_NAME}.description=Home automation
      - traefik.enable=true
      - traefik.http.routers.home-assistant-${ENV_NAME}.rule=Host(`home-assistant.${DOMAIN_SUFFIX}`)
      - traefik.http.routers.home-assistant-${ENV_NAME}.tls=true
      - traefik.http.routers.home-assistant-${ENV_NAME}.tls.certresolver=desec
      - traefik.http.routers.home-assistant-${ENV_NAME}.tls.domains[0].main=${DOMAIN_SUFFIX}
      - traefik.http.routers.home-assistant-${ENV_NAME}.tls.domains[0].sans=*.${DOMAIN_SUFFIX}
      - traefik.http.services.home-assistant-${ENV_NAME}.loadbalancer.server.port=8123
      - traefik.docker.network=homelab-ingress
      - home-services.managed=true
  mosquitto:
    image: eclipse-mosquitto:${MOSQUITTO_VERSION}
    configs:
      - source: mosquitto_config
        target: /mosquitto/config/mosquitto.conf
        mode: 0644
    volumes:
      - type: bind
        source: /srv/data/${ENV_NAME}/mosquitto/data
        target: /mosquitto/data
        bind:
          create_host_path: false
    ports:
      - ${MOSQUITTO_MQTT_PORT}:1883
    networks:
      backend:
        aliases:
          - homelab-${ENV_NAME}_mosquitto
    scale: ${MOSQUITTO_REPLICAS}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    mem_limit: 64M
    mem_reservation: 16M
    labels:
      - homepage.instance.${ENV_NAME}.group=Infrastructure
      - homepage.instance.${ENV_NAME}.name=Mosquitto
      - homepage.instance.${ENV_NAME}.icon=mqtt.png
      - homepage.instance.${ENV_NAME}.description=MQTT broker
      - home-services.managed=true
  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:${ZIGBEE2MQTT_VERSION}
    environment:
      TZ: Europe/London
      Z2M_WATCHDOG: default
      ZIGBEE2MQTT_CONFIG_SERIAL_PORT: /dev/ttyUSB0
      ZIGBEE2MQTT_CONFIG_SERIAL_ADAPTER: zstack
      ZIGBEE2MQTT_CONFIG_MQTT_SERVER: mqtt://homelab-${ENV_NAME}_mosquitto:1883
    volumes:
      - type: bind
        source: /srv/data/${ENV_NAME}/zigbee2mqtt/data
        target: /app/data
        bind:
          create_host_path: false
    networks:
      backend:
        aliases:
          - homelab-${ENV_NAME}_zigbee2mqtt
      ingress: {}
    scale: ${ZIGBEE2MQTT_REPLICAS}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    mem_limit: 256M
    mem_reservation: 128M
    labels:
      - homepage.instance.${ENV_NAME}.group=Home
      - homepage.instance.${ENV_NAME}.name=Zigbee2MQTT
      - homepage.instance.${ENV_NAME}.icon=zigbee2mqtt.png
      - homepage.instance.${ENV_NAME}.href=https://zigbee2mqtt.${DOMAIN_SUFFIX}
      - homepage.instance.${ENV_NAME}.description=Zigbee devices
      - traefik.enable=true
      - traefik.http.routers.zigbee2mqtt-${ENV_NAME}.rule=Host(`zigbee2mqtt.${DOMAIN_SUFFIX}`)
      - traefik.http.routers.zigbee2mqtt-${ENV_NAME}.tls=true
      - traefik.http.routers.zigbee2mqtt-${ENV_NAME}.tls.certresolver=desec
      - traefik.http.routers.zigbee2mqtt-${ENV_NAME}.tls.domains[0].main=${DOMAIN_SUFFIX}
      - traefik.http.routers.zigbee2mqtt-${ENV_NAME}.tls.domains[0].sans=*.${DOMAIN_SUFFIX}
      - traefik.http.services.zigbee2mqtt-${ENV_NAME}.loadbalancer.server.port=8080
      - traefik.docker.network=homelab-ingress
      - home-services.managed=true
    devices:
      - ${ZIGBEE_DEVICE}:/dev/ttyUSB0
    depends_on:
      mosquitto:
        condition: service_started
  traefik:
    image: traefik:${TRAEFIK_VERSION}
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=homelab-ingress
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.desec.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.desec.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.desec.acme.dnschallenge=true
      - --certificatesresolvers.desec.acme.dnschallenge.provider=desec
      - --certificatesresolvers.desec.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53
      - --log.level=INFO
      - --accesslog=true
      - --providers.docker.constraints=Label(`home-services.managed`, `true`)
    environment:
      DESEC_TOKEN_FILE: /run/secrets/desec_token
      LEGO_EXPERIMENTAL_CNAME_SUPPORT: 'true'
    secrets:
      - desec_token
    ports:
      - ${TRAEFIK_HTTP_PORT}:80
      - ${TRAEFIK_HTTPS_PORT}:443
      - ${TRAEFIK_DASHBOARD_PORT}:8080
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
        read_only: true
      - type: bind
        source: /srv/data/${ENV_NAME}/traefik/letsencrypt
        target: /letsencrypt
        bind:
          create_host_path: false
      - type: bind
        source: /srv/data/${ENV_NAME}/traefik/dynamic
        target: /etc/traefik/dynamic
        bind:
          create_host_path: false
        read_only: true
    networks:
      ingress: {}
    scale: ${TRAEFIK_REPLICAS}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    mem_limit: 128M
    mem_reservation: 64M
    labels:
      - homepage.instance.${ENV_NAME}.group=Infrastructure
      - homepage.instance.${ENV_NAME}.name=Traefik
      - homepage.instance.${ENV_NAME}.icon=traefik.png
      - homepage.instance.${ENV_NAME}.description=HTTPS ingress
      - home-services.managed=true
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:${AUDIOBOOKSHELF_VERSION}
    volumes:
      - type: bind
        source: /srv/data/${ENV_NAME}/audiobookshelf/Audiobooks
        target: /audiobooks
        bind:
          create_host_path: false
      - type: bind
        source: /srv/data/${ENV_NAME}/audiobookshelf/config
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: /srv/data/${ENV_NAME}/audiobookshelf/metadata
        target: /metadata
        bind:
          create_host_path: false
      - type: bind
        source: /srv/data/${ENV_NAME}/audiobookshelf/ChildrensAudiobooks
        target: /ChildrensAudiobooks
        bind:
          create_host_path: false
      - type: bind
        source: /srv/data/${ENV_NAME}/audiobookshelf/Podcasts
        target: /Podcasts
        bind:
          create_host_path: false
    environment:
      TZ: Europe/London
    networks:
      backend:
        aliases:
          - homelab-${ENV_NAME}_audiobookshelf
      ingress: {}
    scale: ${AUDIOBOOKSHELF_REPLICAS}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    mem_limit: 256M
    mem_reservation: 128M
    labels:
      - homepage.instance.${ENV_NAME}.group=Media
      - homepage.instance.${ENV_NAME}.name=Audiobookshelf
      - homepage.instance.${ENV_NAME}.icon=audiobookshelf.png
      - homepage.instance.${ENV_NAME}.href=https://audiobookshelf.${DOMAIN_SUFFIX}
      - homepage.instance.${ENV_NAME}.description=Audiobooks and podcasts
      - traefik.enable=true
      - traefik.http.routers.audiobookshelf-${ENV_NAME}.rule=Host(`audiobookshelf.${DOMAIN_SUFFIX}`)
      - traefik.http.routers.audiobookshelf-${ENV_NAME}.tls=true
      - traefik.http.routers.audiobookshelf-${ENV_NAME}.tls.certresolver=desec
      - traefik.http.routers.audiobookshelf-${ENV_NAME}.tls.domains[0].main=${DOMAIN_SUFFIX}
      - traefik.http.routers.audiobookshelf-${ENV_NAME}.tls.domains[0].sans=*.${DOMAIN_SUFFIX}
      - traefik.http.services.audiobookshelf-${ENV_NAME}.loadbalancer.server.port=80
      - traefik.docker.network=homelab-ingress
      - home-services.managed=true
  kavita:
    image: jvmilazz0/kavita:${KAVITA_VERSION}
    volumes:
      - type: bind
        source: /srv/data/${ENV_NAME}/kavita/Books
        target: /books
        bind:
          create_host_path: false
      - type: bind
        source: /srv/data/${ENV_NAME}/kavita/Papers
        target: /papers
        bind:
          create_host_path: false
      - type: bind
        source: /srv/data/${ENV_NAME}/kavita/config
        target: /kavita/config
        bind:
          create_host_path: false
    environment:
      TZ: Europe/London
    networks:
      backend:
        aliases:
          - homelab-${ENV_NAME}_kavita
      ingress: {}
    scale: ${KAVITA_REPLICAS}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    mem_limit: 768M
    mem_reservation: 384M
    labels:
      - homepage.instance.${ENV_NAME}.group=Media
      - homepage.instance.${ENV_NAME}.name=Kavita
      - homepage.instance.${ENV_NAME}.icon=kavita.png
      - homepage.instance.${ENV_NAME}.href=https://kavita.${DOMAIN_SUFFIX}
      - homepage.instance.${ENV_NAME}.description=Books and papers
      - traefik.enable=true
      - traefik.http.routers.kavita-${ENV_NAME}.rule=Host(`kavita.${DOMAIN_SUFFIX}`)
      - traefik.http.routers.kavita-${ENV_NAME}.tls=true
      - traefik.http.routers.kavita-${ENV_NAME}.tls.certresolver=desec
      - traefik.http.routers.kavita-${ENV_NAME}.tls.domains[0].main=${DOMAIN_SUFFIX}
      - traefik.http.routers.kavita-${ENV_NAME}.tls.domains[0].sans=*.${DOMAIN_SUFFIX}
      - traefik.http.services.kavita-${ENV_NAME}.loadbalancer.server.port=5000
      - traefik.http.routers.kavita-${ENV_NAME}.tls.options=compat@file
      - traefik.docker.network=homelab-ingress
      - home-services.managed=true
  pocket-id:
    image: pocketid/pocket-id:${POCKET_ID_VERSION}
    environment:
      TZ: Europe/London
      APP_URL: https://pocket-id.${DOMAIN_SUFFIX}
      TRUST_PROXY: 'true'
      ENCRYPTION_KEY_FILE: /run/secrets/pocket_id_encryption_key
    secrets:
      - pocket_id_encryption_key
    volumes:
      - type: bind
        source: /srv/data/${ENV_NAME}/pocket-id/data
        target: /app/data
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - /app/pocket-id
        - healthcheck
      interval: 1m30s
      timeout: 5s
      retries: 2
      start_period: 10s
    networks:
      backend:
        aliases:
          - homelab-${ENV_NAME}_pocket-id
      ingress: {}
    scale: ${POCKET_ID_REPLICAS}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    mem_limit: 256M
    mem_reservation: 128M
    labels:
      - homepage.instance.${ENV_NAME}.group=Infrastructure
      - homepage.instance.${ENV_NAME}.name=Pocket ID
      - homepage.instance.${ENV_NAME}.icon=pocket-id.png
      - homepage.instance.${ENV_NAME}.href=https://pocket-id.${DOMAIN_SUFFIX}
      - homepage.instance.${ENV_NAME}.description=Sign in to home services
      - traefik.enable=true
      - traefik.http.routers.pocket-id-${ENV_NAME}.rule=Host(`pocket-id.${DOMAIN_SUFFIX}`)
      - traefik.http.routers.pocket-id-${ENV_NAME}.tls=true
      - traefik.http.routers.pocket-id-${ENV_NAME}.tls.certresolver=desec
      - traefik.http.routers.pocket-id-${ENV_NAME}.tls.domains[0].main=${DOMAIN_SUFFIX}
      - traefik.http.routers.pocket-id-${ENV_NAME}.tls.domains[0].sans=*.${DOMAIN_SUFFIX}
      - traefik.http.services.pocket-id-${ENV_NAME}.loadbalancer.server.port=1411
      - traefik.docker.network=homelab-ingress
      - home-services.managed=true
  trek:
    image: mauriceboe/trek:${TREK_VERSION}
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    tmpfs:
      - /tmp:noexec,nosuid,size=128m
    environment:
      NODE_ENV: production
      PORT: '3000'
      TZ: Europe/London
      LOG_LEVEL: info
      ALLOW_INTERNAL_NETWORK: 'true'
      APP_URL: https://trek.${DOMAIN_SUFFIX}
    volumes:
      - type: bind
        source: /srv/data/${ENV_NAME}/trek/data
        target: /app/data
        bind:
          create_host_path: false
      - type: bind
        source: /srv/data/${ENV_NAME}/trek/uploads
        target: /app/uploads
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://localhost:3000/api/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      backend:
        aliases:
          - homelab-${ENV_NAME}_trek
      ingress: {}
    scale: ${TREK_REPLICAS}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    mem_limit: 512M
    mem_reservation: 256M
    labels:
      - homepage.instance.${ENV_NAME}.group=Home
      - homepage.instance.${ENV_NAME}.name=Trek
      - homepage.instance.${ENV_NAME}.href=https://trek.${DOMAIN_SUFFIX}
      - traefik.enable=true
      - traefik.http.routers.trek-${ENV_NAME}.rule=Host(`trek.${DOMAIN_SUFFIX}`)
      - traefik.http.routers.trek-${ENV_NAME}.tls=true
      - traefik.http.routers.trek-${ENV_NAME}.tls.certresolver=desec
      - traefik.http.routers.trek-${ENV_NAME}.tls.domains[0].main=${DOMAIN_SUFFIX}
      - traefik.http.routers.trek-${ENV_NAME}.tls.domains[0].sans=*.${DOMAIN_SUFFIX}
      - traefik.http.services.trek-${ENV_NAME}.loadbalancer.server.port=3000
      - traefik.docker.network=homelab-ingress
      - home-services.managed=true
  immich-redis:
    image: docker.io/valkey/valkey:9
    networks:
      backend:
        aliases:
          - homelab-${ENV_NAME}_immich-redis
    scale: ${IMMICH_REDIS_REPLICAS}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    mem_limit: 256M
    mem_reservation: 128M
    labels:
      - homepage.instance.${ENV_NAME}.group=Backends
      - homepage.instance.${ENV_NAME}.name=Immich Redis
      - homepage.instance.${ENV_NAME}.icon=valkey.png
      - homepage.instance.${ENV_NAME}.description=Immich cache
      - home-services.managed=true
  immich-postgres:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_USER: immich
      POSTGRES_PASSWORD_FILE: /run/secrets/immich_db_password
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: --data-checksums
    secrets:
      - immich_db_password
    tmpfs:
      - /dev/shm:size=128m
    volumes:
      - type: bind
        source: /srv/data/${ENV_NAME}/immich/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    networks:
      backend:
        aliases:
          - homelab-${ENV_NAME}_immich-postgres
    scale: ${IMMICH_DB_REPLICAS}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    mem_limit: 1G
    mem_reservation: 512M
    labels:
      - homepage.instance.${ENV_NAME}.group=Backends
      - homepage.instance.${ENV_NAME}.name=Immich Postgres
      - homepage.instance.${ENV_NAME}.icon=postgres.png
      - homepage.instance.${ENV_NAME}.description=Immich database
      - home-services.managed=true
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION}
    volumes:
      - type: bind
        source: /srv/data/${ENV_NAME}/immich/model-cache
        target: /cache
        bind:
          create_host_path: false
    networks:
      backend:
        aliases:
          - homelab-${ENV_NAME}_immich-machine-learning
    scale: ${IMMICH_ML_REPLICAS}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    mem_limit: 2G
    mem_reservation: 1G
    labels:
      - homepage.instance.${ENV_NAME}.group=Backends
      - homepage.instance.${ENV_NAME}.name=Immich Machine Learning
      - homepage.instance.${ENV_NAME}.icon=immich.png
      - homepage.instance.${ENV_NAME}.description=Immich machine learning
      - home-services.managed=true
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION}
    environment:
      TZ: Europe/London
      DB_HOSTNAME: homelab-${ENV_NAME}_immich-postgres
      DB_USERNAME: immich
      DB_PASSWORD_FILE: /run/secrets/immich_db_password
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: homelab-${ENV_NAME}_immich-redis
    secrets:
      - immich_db_password
    volumes:
      - type: bind
        source: /srv/data/${ENV_NAME}/immich/upload
        target: /data
        bind:
          create_host_path: false
    networks:
      backend:
        aliases:
          - homelab-${ENV_NAME}_immich-server
      ingress: {}
    scale: ${IMMICH_REPLICAS}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    mem_limit: 2.5G
    mem_reservation: 768M
    labels:
      - homepage.instance.${ENV_NAME}.group=Media
      - homepage.instance.${ENV_NAME}.name=Immich
      - homepage.instance.${ENV_NAME}.icon=immich.png
      - homepage.instance.${ENV_NAME}.href=https://immich.${DOMAIN_SUFFIX}
      - homepage.instance.${ENV_NAME}.description=Photos and videos
      - traefik.enable=true
      - traefik.http.routers.immich-${ENV_NAME}.rule=Host(`immich.${DOMAIN_SUFFIX}`)
      - traefik.http.routers.immich-${ENV_NAME}.tls=true
      - traefik.http.routers.immich-${ENV_NAME}.tls.certresolver=desec
      - traefik.http.routers.immich-${ENV_NAME}.tls.domains[0].main=${DOMAIN_SUFFIX}
      - traefik.http.routers.immich-${ENV_NAME}.tls.domains[0].sans=*.${DOMAIN_SUFFIX}
      - traefik.http.services.immich-${ENV_NAME}.loadbalancer.server.port=2283
      - traefik.docker.network=homelab-ingress
      - home-services.managed=true
  homepage-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:${HOMEPAGE_SOCKET_PROXY_VERSION}
    environment:
      CONTAINERS: '1'
      POST: '0'
      EVENTS: '0'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - homepage-discovery
    scale: ${HOMEPAGE_REPLICAS}
    restart: unless-stopped
    mem_limit: 64M
    mem_reservation: 16M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    labels:
      - home-services.managed=true
  jellyfin:
    image: jellyfin/jellyfin:${JELLYFIN_VERSION}
    restart: unless-stopped
    labels:
      - homepage.instance.${ENV_NAME}.group=Media
      - homepage.instance.${ENV_NAME}.name=Jellyfin
      - homepage.instance.${ENV_NAME}.icon=jellyfin.png
      - homepage.instance.${ENV_NAME}.href=https://jellyfin.${DOMAIN_SUFFIX}
      - homepage.instance.${ENV_NAME}.description=Films, TV and music
      - home-services.managed=true
      - traefik.enable=true
      - traefik.docker.network=homelab-ingress
      - traefik.http.routers.jellyfin-${ENV_NAME}.rule=Host(`jellyfin.${DOMAIN_SUFFIX}`)
      - traefik.http.routers.jellyfin-${ENV_NAME}.tls=true
      - traefik.http.routers.jellyfin-${ENV_NAME}.tls.certresolver=desec
      - traefik.http.routers.jellyfin-${ENV_NAME}.tls.domains[0].main=${DOMAIN_SUFFIX}
      - traefik.http.routers.jellyfin-${ENV_NAME}.tls.domains[0].sans=*.${DOMAIN_SUFFIX}
      - traefik.http.services.jellyfin-${ENV_NAME}.loadbalancer.server.port=8096
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - ${JELLYFIN_RENDER_GID}
    ports:
      - ${JELLYFIN_HTTP_PORT}:8096
    volumes:
      - type: bind
        source: /var/cache/${ENV_NAME}/jellyfin
        target: /cache
        bind:
          create_host_path: false
      - type: bind
        source: /srv/data/${ENV_NAME}/jellyfin/config
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: /srv/data/${ENV_NAME}/jellyfin/Music
        target: /Music
        bind:
          create_host_path: false
      - type: bind
        source: /srv/data/${ENV_NAME}/jellyfin/Movies
        target: /Movies
        bind:
          create_host_path: false
      - type: bind
        source: /srv/data/${ENV_NAME}/jellyfin/TV
        target: /TV
        bind:
          create_host_path: false
      - type: bind
        source: /srv/data/${ENV_NAME}/jellyfin/ChildrensMovies
        target: /ChildrensMovies
        bind:
          create_host_path: false
      - type: bind
        source: /srv/data/${ENV_NAME}/jellyfin/ChildrensClips
        target: /ChildrensClips
        bind:
          create_host_path: false
      - type: bind
        source: /srv/data/${ENV_NAME}/jellyfin/ChildrensTV
        target: /ChildrensTV
        bind:
          create_host_path: false
      - type: bind
        source: /srv/data/${ENV_NAME}/jellyfin/Classical
        target: /Classical
        bind:
          create_host_path: false
    tmpfs:
      - /tmp/jellyfin
    networks:
      backend:
        aliases:
          - homelab-${ENV_NAME}_jellyfin
          - jellyfin-${ENV_NAME}
      ingress: {}
    scale: ${JELLYFIN_REPLICAS}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
networks:
  backend:
    driver: bridge
  ingress:
    external: true
    name: homelab-ingress
  homepage-discovery:
    driver: bridge
    internal: true
configs:
  pihole_custom_dns:
    content: |
      local=/home/
      local=/preprod.home/
      local=/lan.barlows.cool/
      local=/preprod.lan.barlows.cool/
      bogus-priv
      address=/home/${N100_LAN_IP:?Set N100_LAN_IP in the tracked environment file}
      address=/preprod.home/${N100_LAN_IP:?Set N100_LAN_IP in the tracked environment file}
      address=/lan.barlows.cool/${N100_LAN_IP:?Set N100_LAN_IP in the tracked environment file}
      address=/preprod.lan.barlows.cool/${N100_LAN_IP:?Set N100_LAN_IP in the tracked environment file}
  mosquitto_config:
    file: ./mosquitto/mosquitto.conf
  homepage_docker:
    file: ./homepage/docker.yaml
  homepage_settings:
    file: ./homepage/settings.yaml
  homepage_services:
    file: ./homepage/services.yaml
secrets:
  pihole_web_password:
    file: ${SECRETS_DIR:-/etc/home-services/secrets}/${ENV_NAME}/pihole_web_password
  desec_token:
    file: ${SECRETS_DIR:-/etc/home-services/secrets}/${ENV_NAME}/desec_token
  pocket_id_encryption_key:
    file: ${SECRETS_DIR:-/etc/home-services/secrets}/${ENV_NAME}/pocket_id_encryption_key
  immich_db_password:
    file: ${SECRETS_DIR:-/etc/home-services/secrets}/${ENV_NAME}/immich_db_password
